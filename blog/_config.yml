jiathis: true


#### Analytics
google_analytics: UA-63838023-1 
baidu_analytics: 5ab1107031547fb5411cd06ed47f1348

# Extensions
## Plugins: https://github.com/hexojs/hexo/wiki/Plugins
## Themes: https://github.com/hexojs/hexo/wiki/Themes
theme: next #customtheme #landscape #next
stylus:
	compress:true
exclude_generator:

# Skip rendering for pre-built HTML files (e.g., resume)
skip_render:
  - 'resume_*.html'

search:
  path: search.xml # search.json
  field: post
  format: html
  limit: 10000

# Deployment
## Docs: http://hexo.io/docs/deployment.html
deploy:
  type: git
  #repo: https://github.com/huaqianlee/huaqianlee.github.io.git
  repo: git@github.com:huaqianlee/huaqianlee.github.io.git
  branch: master
